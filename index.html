<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Furniture and home decor, chosen well. Browse by room, brand or style." />
    <title>Cartio — Decorate your Space with Us</title>
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      Baseline Open Graph. Per-page tags are set at runtime by src/lib/seo.ts, but social
      scrapers (Facebook, LinkedIn, Slack, WhatsApp, X) read this raw HTML and never run the
      app, so these are the tags every shared link actually gets. Making them per-page needs
      prerendering or SSR — see seo.ts.
    -->
    <meta property="og:site_name" content="Cartio" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cartio — Decorate your Space with Us" />
    <meta property="og:description" content="Furniture and home decor, chosen well. Browse by room, brand or style." />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const stored = localStorage.getItem("theme");
        document.documentElement.dataset.theme = stored === "dark" || stored === "light" ? stored : "light";
      } catch (_) {}
    </script>
  </head>
  <body class="min-h-full flex flex-col bg-canvas text-ink">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
